server:
  port: 18088

spring:
  application:
    name: myblog-backend
  # 加载 backend/config/ 下的本地配置（application-local.yml，已 gitignore）。
  # 相对路径基于启动时的工作目录，因此必须在 backend/ 目录下启动。
  config:
    additional-location: optional:file:./config/
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

blog:
  jwt:
    # 生产必须用环境变量 BLOG_JWT_SECRET 覆盖
    secret: ${BLOG_JWT_SECRET:myblog-dev-secret-override-in-production-0123456789abcdef}
    expire-days: 7
  admin:
    # 单管理员模型（设计规格 §13 YAGNI），生产必须用环境变量覆盖
    username: ${BLOG_ADMIN_USERNAME:admin}
    password: ${BLOG_ADMIN_PASSWORD:admin123}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
