server:
  port: 18088

spring:
  application:
    name: myblog-backend
  # 加载本地配置单文件 backend/config/application-local.yml（已 gitignore）。
  # 用 import 而非 additional-location：spring.config.additional-location 必须在
  # application.yml 被读取之前（环境变量 / 系统属性 / 命令行参数）定义，写在这里不生效。
  # 注意 import 只能指向文件，不能指向目录。
  # 相对路径基于启动时的工作目录，因此必须在 backend/ 目录下启动；文件不存在时静默跳过。
  # 被导入文件的值优先于本文件。
  config:
    import: optional:file:./config/application-local.yml
  # 库名须与 db/schema.sql 里的 CREATE DATABASE 保持一致（happyblog）。
  # 本默认值只在未提供 DB_URL 时生效，config/application-local.yml 会覆盖它 ——
  # 二者一旦漂移，按默认配置启动时报的是 Unknown database，与 schema.sql 对不上号。
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/happyblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  jackson:
    # 不设置 date-format：它只作用于 java.util.Date（本项目几乎不用），
    # 对 java.time.LocalDateTime 无效，是「看似生效实则不生效」的静默陷阱。
    # 将来 article 接口涉及时间字段时，用 @JsonFormat(pattern = "yyyy-MM-dd HH:mm:ss")
    # 或注册 Jackson2ObjectMapperBuilderCustomizer，不要依赖 date-format 属性。
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    # 必须为 false：本项目 DDL 与实体字段统一用驼峰列名（`coverImage`、`categoryName`、`createdAt` …）。
    # 该开关为 true 时，没有显式 @TableField(value=...) 的字段名会被 camelToUnderline 转成下划线
    # 再去找列（cover_image），与 DDL 对不上，BaseMapper 生成的 insert / selectById / updateById /
    # 逻辑删除会全部抛 1054 Unknown column。这是「看着没问题、单测全绿、连真库才炸」的静默陷阱：
    # 它是列名的唯一控制点（TableInfo 构造时读 Configuration.isMapUnderscoreToCamelCase() 存入
    # underCamel），主键与表名因 @TableId(value=...) / @TableName(...) 显式给值而幸免。
    # 回归护栏见 ColumnNamingConventionTest。
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

blog:
  jwt:
    # 生产必须用环境变量 BLOG_JWT_SECRET 覆盖
    secret: ${BLOG_JWT_SECRET:myblog-dev-secret-override-in-production-0123456789abcdef}
    expire-days: 7
  admin:
    # 单管理员模型（设计规格 §13 YAGNI），生产必须用环境变量覆盖
    username: ${BLOG_ADMIN_USERNAME:admin}
    password: ${BLOG_ADMIN_PASSWORD:admin123}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
